name: Build All Platforms (Windows EXE, Mac DMG, Android APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run vite:build

      - name: Package Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release/*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0

      - name: Build Web Application
        run: npm run vite:build

      - name: Initialize Capacitor & Add Android platform
        run: |
          npx cap init "Curly AI" "ai.curly.studio" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk-android
          path: android/app/build/outputs/apk/debug/*.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Organize release files
        run: |
          mkdir -p release-files
          find all-artifacts -name "*.apk" -exec cp {} release-files/Curly-AI.apk \;
          find all-artifacts -name "*.exe" -exec cp {} release-files/ \;
          find all-artifacts -name "*.dmg" -exec cp {} release-files/ \;
          ls -la release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          name: "Curly AI Studio v1.0.0 — Android APK, Windows EXE & Mac DMG"
          body: |
            ## 🎉 Curly AI Studio v1.0.0 Release

            ### ⬇️ Download for your device:
            - **📱 Android APK:** `Curly-AI.apk` (Install directly on Android phones/tablets)
            - **🪟 Windows Desktop:** `.exe` installer / portable application
            - **🍎 macOS Package:** `.dmg` application bundle
          files: release-files/*
